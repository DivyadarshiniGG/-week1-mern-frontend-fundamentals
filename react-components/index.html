<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>React Components Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --navy: #0F2740; --slate: #33475B; --ivory: #F7F5F1;
    --amber: #E3A008; --teal: #1B7A72; --border: #E1DDD3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--ivory); color: var(--slate); }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; color: var(--navy); margin: 0; }
  .container { max-width: 900px; margin: 0 auto; padding: 32px 24px 80px; }

  /* Header component */
  .app-header { background: var(--navy); padding: 20px 0; margin-bottom: 32px; }
  .app-header .inner { max-width: 900px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
  .app-header h1 { color: var(--ivory); font-size: 1.3rem; }
  .app-header nav a { color: #B7C6D9; margin-left: 20px; font-size: 0.9rem; text-decoration: none; }

  /* Section labels */
  .demo-section { margin-bottom: 48px; }
  .demo-label { color: var(--teal); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 12px; }

  /* Button component */
  .btn { font-family: 'Inter', sans-serif; font-weight: 600; padding: 10px 18px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; font-size: 0.95rem; }
  .btn-primary { background: var(--navy); color: var(--ivory); }
  .btn-primary:hover { background: #163a5c; }
  .btn-ghost { background: transparent; border-color: var(--navy); color: var(--navy); }
  .btn-ghost:hover { background: var(--navy); color: var(--ivory); }
  .btn-danger { background: #B3492B; color: var(--ivory); }
  .btn-danger:hover { background: #953a20; }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  /* Card component */
  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .card h3 { font-size: 1.05rem; margin-bottom: 6px; }
  .card p { margin: 0 0 12px; font-size: 0.92rem; }
  .card-tag { display: inline-block; background: #EFEAE0; color: var(--teal); font-size: 0.75rem; font-weight: 600; padding: 3px 8px; border-radius: 4px; margin-bottom: 10px; }

  /* Form component */
  .form-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 24px; max-width: 420px; }
  .form-card label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--navy); margin: 12px 0 4px; }
  .form-card input { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px; font-family: 'Inter', sans-serif; }
  .form-success { margin-top: 14px; color: var(--teal); font-weight: 600; font-size: 0.9rem; }

  /* Footer component */
  .app-footer { border-top: 1px solid var(--border); padding: 20px 0; text-align: center; font-size: 0.85rem; color: var(--slate); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ---------- 1. Header component (takes props) ---------- */
function Header({ title, links }) {
  return (
    <header className="app-header">
      <div className="inner">
        <h1>{title}</h1>
        <nav>
          {links.map((link) => <a key={link} href="#">{link}</a>)}
        </nav>
      </div>
    </header>
  );
}

/* ---------- 2. Button component (takes props: variant, label, onClick) ---------- */
function Button({ variant = "primary", children, onClick }) {
  return (
    <button className={`btn btn-${variant}`} onClick={onClick}>
      {children}
    </button>
  );
}

/* ---------- 3. Card component (takes props) ---------- */
function Card({ title, description, tag }) {
  return (
    <div className="card">
      {tag && <span className="card-tag">{tag}</span>}
      <h3>{title}</h3>
      <p>{description}</p>
    </div>
  );
}

/* ---------- 4. Form component (manages its own state) ---------- */
function ContactForm() {
  const [form, setForm] = useState({ name: "", email: "" });
  const [submitted, setSubmitted] = useState(false);

  function handleChange(e) {
    setForm({ ...form, [e.target.name]: e.target.value });
  }

  function handleSubmit(e) {
    e.preventDefault();
    setSubmitted(true);
  }

  return (
    <form className="form-card" onSubmit={handleSubmit}>
      <label htmlFor="name">Name</label>
      <input id="name" name="name" value={form.name} onChange={handleChange} placeholder="Your name" required />

      <label htmlFor="email">Email</label>
      <input id="email" name="email" type="email" value={form.email} onChange={handleChange} placeholder="you@example.com" required />

      <div style={{ marginTop: 16 }}>
        <Button variant="primary">Submit</Button>
      </div>

      {submitted && (
        <p className="form-success">Thanks, {form.name || "friend"} — form captured in state.</p>
      )}
    </form>
  );
}

/* ---------- 5. Footer component (takes props) ---------- */
function Footer({ year, owner }) {
  return (
    <footer className="app-footer">
      <p>&copy; {year} {owner}. Built for React Components Practice — Week 1.</p>
    </footer>
  );
}

/* ---------- Demo wiring: dynamic rendering with props + state ---------- */
function App() {
  const [clickCount, setClickCount] = useState(0);

  const projectCards = [
    { title: "Portfolio Site", description: "Responsive HTML/CSS personal site.", tag: "HTML/CSS" },
    { title: "Component Library", description: "Five reusable React components.", tag: "React" },
    { title: "Blog UI", description: "Post cards rendered from JSON data.", tag: "React" },
  ];

  return (
    <React.Fragment>
      <Header title="React Components Practice" links={["Docs", "Repo", "Contact"]} />

      <div className="container">
        <section className="demo-section">
          <p className="demo-label">Button — click state</p>
          <div className="btn-row">
            <Button variant="primary" onClick={() => setClickCount(clickCount + 1)}>Clicked {clickCount} times</Button>
            <Button variant="ghost" onClick={() => setClickCount(0)}>Reset</Button>
            <Button variant="danger" onClick={() => setClickCount(clickCount - 1)}>Decrement</Button>
          </div>
        </section>

        <section className="demo-section">
          <p className="demo-label">Card — rendered dynamically from an array via props</p>
          <div className="card-grid">
            {projectCards.map((c) => <Card key={c.title} {...c} />)}
          </div>
        </section>

        <section className="demo-section">
          <p className="demo-label">Form — controlled inputs, local state</p>
          <ContactForm />
        </section>
      </div>

      <Footer year={2026} owner="Aarav Sharma" />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
