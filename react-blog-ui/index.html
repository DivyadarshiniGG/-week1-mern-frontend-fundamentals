<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>React Blog UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --navy: #0F2740; --slate: #33475B; --ivory: #F7F5F1;
    --amber: #E3A008; --teal: #1B7A72; --border: #E1DDD3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--ivory); color: var(--slate); }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; color: var(--navy); margin: 0; }
  .container { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }

  .page-header { margin-bottom: 28px; }
  .page-header h1 { font-size: 1.9rem; margin-bottom: 8px; }
  .page-header p { margin: 0; color: var(--slate); }

  .controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
  .search-input {
    flex: 1; min-width: 200px; padding: 10px 14px; border: 1px solid var(--border);
    border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.95rem;
  }
  .filter-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: #fff; color: var(--slate); font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .pill.active { background: var(--navy); color: var(--ivory); border-color: var(--navy); }

  .result-count { font-size: 0.85rem; color: var(--teal); font-weight: 600; margin-bottom: 16px; }

  .post-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
  .post-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 22px; display: flex; flex-direction: column; }
  .post-tag { display: inline-block; background: #EFEAE0; color: var(--teal); font-size: 0.75rem; font-weight: 600; padding: 3px 8px; border-radius: 4px; margin-bottom: 10px; width: fit-content; }
  .post-card h3 { font-size: 1.05rem; margin-bottom: 8px; line-height: 1.3; }
  .post-card p { margin: 0 0 12px; font-size: 0.92rem; flex-grow: 1; }
  .post-date { font-size: 0.8rem; color: #8A9AAB; margin: 0; }

  .empty-state { text-align: center; padding: 48px 0; color: var(--slate); }
  .empty-state h3 { margin-bottom: 8px; }

  .load-state { text-align: center; padding: 48px 0; color: var(--slate); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* Fallback copy of posts.json — used automatically when the page is opened
   directly (file://) instead of through a server, since fetch() is blocked
   by the browser in that case. Keep this in sync with posts.json. */
const EMBEDDED_POSTS = [
  { "id": 1, "title": "Getting Started with Semantic HTML", "category": "HTML", "excerpt": "Why <section>, <article>, and <nav> matter more than a div-only mindset — and how they help accessibility and SEO.", "date": "2026-08-03" },
  { "id": 2, "title": "Flexbox vs. Grid: When to Use Which", "category": "CSS", "excerpt": "A practical breakdown of one-dimensional layouts with Flexbox versus two-dimensional layouts with Grid.", "date": "2026-08-06" },
  { "id": 3, "title": "Responsive Design Without the Guesswork", "category": "CSS", "excerpt": "Using relative units, media queries, and container-aware layouts to build pages that hold up on any screen.", "date": "2026-08-09" },
  { "id": 4, "title": "ES6 Features Every Frontend Dev Should Know", "category": "JavaScript", "excerpt": "Arrow functions, destructuring, template literals, and spread syntax — the modern JS toolkit in practice.", "date": "2026-08-12" },
  { "id": 5, "title": "Understanding Props and State in React", "category": "React", "excerpt": "Props flow down, state lives inside a component — the two ideas that make React components predictable.", "date": "2026-08-15" },
  { "id": 6, "title": "Building Your First Reusable Component", "category": "React", "excerpt": "A walkthrough of designing a Button component that adapts through props instead of being copy-pasted everywhere.", "date": "2026-08-18" },
  { "id": 7, "title": "Handling Events the React Way", "category": "React", "excerpt": "onClick, onChange, and onSubmit — how React wraps the DOM event system and why synthetic events exist.", "date": "2026-08-21" },
  { "id": 8, "title": "CSS Custom Properties for Theming", "category": "CSS", "excerpt": "Using CSS variables to build a consistent design system that's easy to update from one place.", "date": "2026-08-24" }
];

/* Card component for a single blog post */
function PostCard({ post }) {
  return (
    <article className="post-card">
      <span className="post-tag">{post.category}</span>
      <h3>{post.title}</h3>
      <p>{post.excerpt}</p>
      <p className="post-date">{new Date(post.date).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}</p>
    </article>
  );
}

function App() {
  const [posts, setPosts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [query, setQuery] = useState("");
  const [category, setCategory] = useState("All");

  // Load post cards from the JSON data source.
  // We try fetching posts.json first (works when served over http://, e.g. GitHub Pages
  // or a local server). If that fails — which happens when the file is opened directly
  // as file:// and browsers block fetch() for security — we fall back to the embedded
  // copy of the same JSON below, so the page always works no matter how it's opened.
  useEffect(() => {
    fetch("./posts.json")
      .then((res) => res.json())
      .then((data) => { setPosts(data); setLoading(false); })
      .catch(() => { setPosts(EMBEDDED_POSTS); setLoading(false); });
  }, []);

  const categories = useMemo(() => {
    const unique = Array.from(new Set(posts.map((p) => p.category)));
    return ["All", ...unique];
  }, [posts]);

  const filteredPosts = useMemo(() => {
    return posts.filter((post) => {
      const matchesCategory = category === "All" || post.category === category;
      const matchesQuery =
        post.title.toLowerCase().includes(query.toLowerCase()) ||
        post.excerpt.toLowerCase().includes(query.toLowerCase());
      return matchesCategory && matchesQuery;
    });
  }, [posts, query, category]);

  return (
    <div className="container">
      <div className="page-header">
        <h1>Week 1 Learning Log</h1>
        <p>Notes from HTML, CSS, and React fundamentals — searchable and filterable.</p>
      </div>

      <div className="controls">
        <input
          className="search-input"
          type="text"
          placeholder="Search posts..."
          value={query}
          onChange={(e) => setQuery(e.target.value)}
        />
        <div className="filter-pills">
          {categories.map((cat) => (
            <button
              key={cat}
              className={`pill ${category === cat ? "active" : ""}`}
              onClick={() => setCategory(cat)}
            >
              {cat}
            </button>
          ))}
        </div>
      </div>

      {loading ? (
        <div className="load-state">Loading posts…</div>
      ) : (
        <React.Fragment>
          <p className="result-count">{filteredPosts.length} post{filteredPosts.length !== 1 ? "s" : ""} found</p>
          {filteredPosts.length > 0 ? (
            <div className="post-grid">
              {filteredPosts.map((post) => <PostCard key={post.id} post={post} />)}
            </div>
          ) : (
            <div className="empty-state">
              <h3>No posts match your search</h3>
              <p>Try a different keyword or category.</p>
            </div>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
